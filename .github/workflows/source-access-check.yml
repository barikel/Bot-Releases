name: Verify private source access

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/source-access-check.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SOURCE_TOKEN: ${{ secrets.BOT_RELEASES_TOKEN }}
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Check whether release token exists
        id: token
        shell: bash
        run: |
          if [ -n "$SOURCE_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private application source
        id: source
        if: steps.token.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: barikel/Bot
          ref: main
          token: ${{ secrets.BOT_RELEASES_TOKEN }}
          path: source

      - name: Verify application version
        id: version
        if: steps.source.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: grep -q '<Version>2.14.4</Version>' source/AuthorizedWebView2Rpa.csproj

      - name: Persist safe result
        shell: bash
        env:
          TOKEN_CONFIGURED: ${{ steps.token.outputs.configured }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
        run: |
          mkdir -p diagnostics
          cat > diagnostics/source-access.json <<EOF
          {
            "tokenConfigured": "${TOKEN_CONFIGURED:-false}",
            "privateCheckout": "${SOURCE_OUTCOME:-skipped}",
            "versionCheck": "${VERSION_OUTCOME:-skipped}",
            "runId": "${GITHUB_RUN_ID}"
          }
          EOF
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/source-access.json
          git commit -m 'ci: record private source access result' || exit 0
          git push
